name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: cancel superseded runs. Pushes to main: queue so two deploys never
# race (cancel-in-progress would kill a deploy mid-upload).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Backend/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (backend)
        run: npm ci
        working-directory: Backend

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:frontend

      - name: Backend tests
        run: npm run test:backend

      - name: Build (merchant SPA + API)
        run: npm run build

      - name: Build (platform SPA)
        run: npm run build:platform

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Backend/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (backend)
        run: npm ci
        working-directory: Backend

      # Pending schema changes ride along with the code that needs them;
      # already-applied migrations are no-ops.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply campaignflow --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy merchant SPA + API
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy platform SPA + API
        run: npm run deploy:platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy gate: the push that ran migrations must leave both workers
      # answering /health with the registered token, or the workflow fails
      # and the previous deploy stays the last-known-good.
      - name: Health-check deployed workers
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          for worker in campaignflow-backend.mhoudou098.workers.dev campaignflow-platform.mhoudou098.workers.dev; do
            curl -fsS --max-time 30 -H "x-health-token: ${HEALTH_CHECK_TOKEN}" "https://${worker}/health" | jq -e '.success == true' > /dev/null
            echo "$worker: healthy"
          done
