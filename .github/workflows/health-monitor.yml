name: Health monitor

# SECURITY: once HEALTH_CHECK_TOKEN is registered on a worker (npx wrangler
# secret put HEALTH_CHECK_TOKEN), its /health endpoint requires the matching
# `x-health-token` header. This workflow sends the value from the same-named
# GitHub Actions secret. Until the secret exists on a worker, that probe is
# answered without the header (open), so this workflow keeps working.

on:
  schedule:
    # Every 10 minutes, offset by 3 so it never lands exactly on our cron.
    - cron: '3/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merchant API /health (body + cron heartbeat)
        id: merchant
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 -H "x-health-token: ${HEALTH_CHECK_TOKEN}" https://campaignflow-backend.mhoudou098.workers.dev/health)
          echo "merchant: $body"
          last=$(jq -r '.lastCronAt // empty' <<<"$body")
          if [ -z "$last" ]; then
            echo "::error::merchant /health has no lastCronAt"
            exit 1
          fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "cron heartbeat age: ${age}s"
          if [ "$age" -gt 1200 ]; then
            echo "::error::merchant cron heartbeat is stale (>20 min): $last"
            exit 1
          fi

      - name: Platform API /health
        env:
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 -H "x-health-token: ${HEALTH_CHECK_TOKEN}" https://campaignflow-platform.mhoudou098.workers.dev/health)
          echo "platform: $body"
          jq -e '.success == true' <<<"$body" > /dev/null

      - name: SPA serves index.html
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://campaignflow-backend.mhoudou098.workers.dev/)
          echo "landing: HTTP $code"
          test "$code" = "200"
